name: Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
        contents: write

    steps:
          - name: Checkout source code
            uses: actions/checkout@v7

          - name: Extract version number from Cargo.toml
            id: version
            shell: bash
            run: |
              echo "version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')" >> $GITHUB_OUTPUT

          - name: Install Rust toolchain
            uses: dtolnay/rust-toolchain@stable

          - name: Build release binary
            run: cargo build --release
          
          - name: Create GitHub Release
            uses: softprops/action-gh-release@v3
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            with:
              name: Shp Decoder v${{ steps.version.outputs.version }}
              tag_name: v${{ steps.version.outputs.version }}
              files: target/release/shp_decoder.exe
              prerelease: false
              body: |
                ## 🔧 更新内容

                - 更改输入框名称到output path

                ## 📦 发布说明

                - 当前版本：v${{ steps.version.outputs.version }}
